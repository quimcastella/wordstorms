name: Web app

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Command line smoke test
        run: |
          npm run storm -- --example holmes --format svg,png,json --out out/ci-storm
          test "$(ls out/ci-storm | wc -l)" -eq 9
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    # Publishes the app to GitHub Pages from master.
    # One-time setup: Settings → Pages → Source: "GitHub Actions", custom domain
    # wordstorms.org, with the domain's DNS pointed at GitHub Pages as GitHub
    # describes there. The build uses relative paths, so a sub-path works too.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
